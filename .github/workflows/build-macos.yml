name: Build RMT on macOS

# The Qt5 frontend built with Apple Clang, twice on an Apple Silicon runner:
# - arm64: native, with Qt5, PortAudio and RtMidi from Homebrew
# - x86_64: for Intel Macs (and Apple Silicon through Rosetta 2). Homebrew no
#   longer installs on Intel, so it is the official Qt 5.15.2 (clang_64, Intel
#   only) with PortAudio and RtMidi built from their sources for x86_64
# PortAudio plays the sound, RtMidi is the MIDI IN (CoreMIDI). The result is
# RMT.app in a DMG: macdeployqt puts the Qt frameworks and the libraries into
# the bundle, so nothing has to be installed to run it; the bundle is signed
# ad hoc (not notarized: the first time it is opened with right click ->
# Open). The program finds its resources/ next to itself (Contents/MacOS),
# like out/ of the build; the configuration is in the user's preferences
# (QSettings), so a new DMG keeps it. A tag v* builds and publishes both.

on:
  push:
    tags: ['v*']
  workflow_dispatch:           # manual test runs: the artifacts only, no release

permissions:
  contents: write

env:
  PORTAUDIO_VERSION: v19.7.0
  RTMIDI_VERSION: 6.0.0

jobs:
  build:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]

    env:
      ARCH: ${{ matrix.arch }}
      DEPS: ${{ github.workspace }}/deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0              # the version comes from the nearest git tag

      # --- arm64: Homebrew ---------------------------------------------------

      - name: Install dependencies (Homebrew)
        if: matrix.arch == 'arm64'
        run: |
          brew install qt@5 portaudio rtmidi pkgconf ninja
          echo "QT_PREFIX=$(brew --prefix qt@5)" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt@5);$(brew --prefix)" >> $GITHUB_ENV
          echo "RUN=" >> $GITHUB_ENV

      # --- x86_64: official Qt, PortAudio and RtMidi from source --------------

      - name: Install Rosetta 2
        if: matrix.arch == 'x86_64'
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - name: Install Qt 5.15.2 (x86_64)
        if: matrix.arch == 'x86_64'
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: mac
          target: desktop
          arch: clang_64
          dir: ${{ runner.temp }}
          setup-python: true

      - name: Build PortAudio and RtMidi (x86_64)
        if: matrix.arch == 'x86_64'
        run: |
          brew install ninja
          # Absolute install names, so that macdeployqt finds and bundles them
          COMMON="-G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
                  -DCMAKE_INSTALL_PREFIX=$DEPS -DCMAKE_INSTALL_NAME_DIR=$DEPS/lib
                  -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0"
          git clone --depth 1 --branch $PORTAUDIO_VERSION https://github.com/PortAudio/portaudio.git portaudio-src
          cmake -S portaudio-src -B portaudio-build $COMMON -DBUILD_SHARED_LIBS=ON
          cmake --build portaudio-build
          cmake --install portaudio-build
          git clone --depth 1 --branch $RTMIDI_VERSION https://github.com/thestk/rtmidi.git rtmidi-src
          cmake -S rtmidi-src -B rtmidi-build $COMMON -DBUILD_SHARED_LIBS=ON \
            -DRTMIDI_API_CORE=ON -DRTMIDI_API_JACK=OFF -DRTMIDI_BUILD_TESTING=OFF
          cmake --build rtmidi-build
          cmake --install rtmidi-build
          ls -la $DEPS/lib $DEPS/include
          QT=${QT_ROOT_DIR:-$Qt5_DIR}             # set by install-qt-action
          echo "QT_PREFIX=$QT" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$DEPS;$QT" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$DEPS/lib/pkgconfig" >> $GITHUB_ENV
          echo "RUN=arch -x86_64" >> $GITHUB_ENV

      - name: Remove AGL from the Qt 5.15.2 CMake files
        if: matrix.arch == 'x86_64'
        # The AGL framework is gone from the recent macOS SDKs
        run: |
          grep -rl AGL "$QT_PREFIX/lib/cmake" | while read f; do
            perl -pi -e 's/;?-framework AGL//g; s#;?[^;"]*/AGL\.framework##g' "$f"
          done
          ! grep -r AGL "$QT_PREFIX/lib/cmake"

      # --- both --------------------------------------------------------------

      - name: Configure
        run: |
          # The arm64 Homebrew of the runner must not be used by the x86_64 build
          IGNORE=
          [ "$ARCH" = x86_64 ] && IGNORE="-DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DRMT_USE_QT=ON \
            -DCMAKE_OSX_ARCHITECTURES=$ARCH -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" $IGNORE

      - name: Build
        run: |
          cmake --build build --parallel
          file build/out/rmt

      - name: Smoke test (offscreen, screenshot of gemx.rmt)
        run: |
          QT_QPA_PLATFORM=offscreen RMT_QT_GRAB=$PWD/rmt-macos-$ARCH.png RMT_QT_GRAB_MS=3000 \
            $RUN ./build/out/rmt rmt/songs/rmt128/raster/gemx.rmt || true
          test -f rmt-macos-$ARCH.png

      - name: Make RMT.app
        run: |
          APP=dist/RMT.app
          VERSION=$(git describe --tags --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')
          mkdir -p $APP/Contents/MacOS $APP/Contents/Resources
          cp build/out/rmt $APP/Contents/MacOS/rmt
          cp -R build/out/resources $APP/Contents/MacOS/
          ICON=
          if sips -s format icns src/res/Rmt.ico --out $APP/Contents/Resources/RMT.icns >/dev/null 2>&1; then
            ICON="<key>CFBundleIconFile</key><string>RMT</string>"
          fi
          cat > $APP/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>rmt</string>
            <key>CFBundleIdentifier</key><string>org.raster-atari.rmt</string>
            <key>CFBundleName</key><string>RMT</string>
            <key>CFBundleDisplayName</key><string>RASTER Music Tracker</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            ${ICON}
          </dict>
          </plist>
          PLIST
          plutil -lint $APP/Contents/Info.plist
          $RUN "$QT_PREFIX/bin/macdeployqt" $APP -always-overwrite
          # Nothing may still come from Homebrew or from the build folders
          if find $APP -type f \( -perm +111 -o -name '*.dylib' \) -exec otool -L {} \; 2>/dev/null \
               | grep -E "^\s+(/opt/homebrew|/usr/local|$DEPS)/"; then
            echo "RMT.app still uses libraries outside the bundle"; exit 1
          fi
          codesign --force --deep --sign - $APP
          codesign --verify --deep --verbose=2 $APP

      - name: Create DMG
        run: |
          mkdir -p dmg
          cp -R dist/RMT.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "RASTER Music Tracker" -srcfolder dmg -ov -format UDZO RMT-macOS-$ARCH.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RMT-macOS-${{ matrix.arch }}
          path: |
            RMT-macOS-${{ matrix.arch }}.dmg
            rmt-macos-${{ matrix.arch }}.png

      - name: Create release and upload asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RMT-macOS-${{ matrix.arch }}.dmg
          prerelease: ${{ contains(github.ref_name, '-rc') }}   # v2.0-rcN of scripts/push.sh
